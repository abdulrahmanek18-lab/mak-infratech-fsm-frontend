<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAK INFRATECH FMS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#1e293b}

/* LOGIN */
.login-container{display:flex;flex-direction:column;min-height:100vh;background:linear-gradient(135deg,#0f172a 0%,#1e293b 50%,#0f172a 100%)}
.login-header{display:flex;align-items:center;gap:12px;padding:24px 40px}
.login-logo{width:44px;height:44px;background:linear-gradient(135deg,#3b82f6,#06b6d4);border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:18px}
.login-brand h2{font-size:18px;color:#fff;font-weight:700}.login-brand span{font-size:12px;color:#94a3b8}
.login-wrapper{flex:1;display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{background:#fff;padding:48px 40px;border-radius:24px;box-shadow:0 25px 50px -12px rgba(0,0,0,0.4);width:100%;max-width:440px}
.secure-label{font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#0891b2;margin-bottom:12px}
.login-box h1{font-size:32px;font-weight:800;margin-bottom:8px;color:#0f172a}
.subtitle{color:#64748b;margin-bottom:32px;font-size:14px}
.form-group{margin-bottom:20px}.form-group label{display:block;margin-bottom:8px;font-size:13px;font-weight:600}
.form-group input{width:100%;padding:14px 18px;border:1.5px solid #e2e8f0;border-radius:12px;font-size:15px;background:#fafafa}
.btn{width:100%;padding:16px;background:#0f172a;color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer}
.error-msg{color:#dc2626;font-size:14px;margin-top:16px;text-align:center;display:none;padding:10px;background:#fef2f2;border-radius:8px}

/* APP */
.app-layout{display:none;min-height:100vh}
.sidebar{position:fixed;left:0;top:0;width:240px;height:100vh;background:#fff;border-right:1px solid #e2e8f0;display:flex;flex-direction:column;z-index:100}
.sidebar-header{padding:20px;border-bottom:1px solid #e2e8f0}
.sidebar-header h2{font-size:16px;color:#0f172a}.sidebar-header span{font-size:11px;color:#64748b}
.nav-menu{flex:1;padding:10px}
.nav-item{padding:12px 16px;border-radius:8px;cursor:pointer;color:#334155;font-size:14px;font-weight:500;margin-bottom:4px}
.nav-item:hover,.nav-item.active{background:#f0f9ff;color:#0891b2}
.sidebar-footer{padding:16px;border-top:1px solid #e2e8f0}
.user-info{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.user-avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#3b82f6,#06b6d4);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600}
.main-content{margin-left:240px;min-height:100vh;background:#f8fafc}
.topbar{background:#fff;padding:16px 32px;border-bottom:1px solid #e2e8f0;display:flex;justify-content:space-between;align-items:center}
.page-title{font-size:20px;font-weight:700;color:#0f172a}
.content-area{padding:32px}

/* TABLE */
.card{background:#fff;border-radius:16px;border:1px solid #e2e8f0;overflow:hidden;margin-bottom:20px}
.card-header{padding:20px 24px;border-bottom:1px solid #e2e8f0;display:flex;justify-content:space-between;align-items:center}
.card-header h3{font-size:16px;font-weight:700;color:#0f172a}
.data-table{width:100%;border-collapse:collapse}
.data-table th{text-align:left;padding:14px 24px;font-size:11px;font-weight:700;text-transform:uppercase;color:#64748b;background:#f8fafc;border-bottom:1px solid #e2e8f0}
.data-table td{padding:14px 24px;border-bottom:1px solid #e2e8f0;font-size:14px}
.badge{display:inline-block;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600}
.badge-green{background:#dcfce7;color:#166534}.badge-yellow{background:#fef9c3;color:#854d0e}.badge-red{background:#fee2e2;color:#991b1b}

/* MODAL */
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(15,23,42,0.6);z-index:200;align-items:center;justify-content:center}
.modal-overlay.active{display:flex}
.modal{background:#fff;border-radius:20px;width:90%;max-width:560px;max-height:90vh;overflow-y:auto}
.modal-header{padding:24px;border-bottom:1px solid #e2e8f0;display:flex;justify-content:space-between;align-items:center}
.modal-header h3{font-size:18px;font-weight:700;color:#0f172a}
.modal-close{background:none;border:none;font-size:24px;cursor:pointer;color:#64748b}
.modal-body{padding:24px}.modal-footer{padding:16px 24px;border-top:1px solid #e2e8f0;display:flex;justify-content:flex-end;gap:10px}

.calc-box{background:#f0f9ff;padding:16px;border-radius:12px;margin-top:16px;border:1px solid #bae6fd}
.calc-box h4{font-size:14px;color:#0369a1;margin-bottom:12px}
.calc-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #e0f2fe;font-size:14px}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginPage" class="login-container">
<div class="login-header">
<div class="login-logo">MI</div>
<div class="login-brand"><h2>MAK INFRATECH</h2><span>Field Management System</span></div>
</div>
<div class="login-wrapper">
<div class="login-box">
<div class="secure-label">Secure Login</div>
<h1>MAK INFRATECH FMS</h1>
<p class="subtitle">Sign in using your assigned username and password.</p>
<div class="form-group"><label>Username</label><input type="email" id="email" placeholder="Enter your email"></div>
<div class="form-group"><label>Password</label><input type="password" id="password" placeholder="Enter your password"></div>
<button class="btn" id="loginBtn">Login</button>
<div id="error" class="error-msg"></div>
</div>
</div>
</div>

<!-- APP -->
<div id="appLayout" class="app-layout">
<aside class="sidebar">
<div class="sidebar-header"><h2>MAK INFRATECH FMS</h2><span>Field Management System</span></div>
<nav class="nav-menu" id="navMenu"></nav>
<div class="sidebar-footer">
<div class="user-info"><div class="user-avatar" id="userAvatar">A</div><div><div id="userName">Admin</div><div style="font-size:12px;color:#64748b">Administrator</div></div></div>
<button class="btn" style="width:auto;padding:10px 20px;background:#475569" id="logoutBtn">Logout</button>
</div>
</aside>
<main class="main-content">
<div class="topbar"><div class="page-title" id="pageTitle">Dashboard</div><button class="btn" style="width:auto;padding:10px 20px;background:#16a34a" id="addBtn">+ Add New</button></div>
<div class="content-area" id="contentArea"></div>
</main>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay">
<div class="modal">
<div class="modal-header"><h3 id="modalTitle">Add New</h3><button class="modal-close" id="closeBtn">x</button></div>
<div class="modal-body" id="modalBody"></div>
<div class="modal-footer"><button class="btn" style="width:auto;background:#475569" id="cancelBtn">Cancel</button><button class="btn" style="width:auto" id="saveBtn">Save</button></div>
</div>
</div>

<script>
var API = "https://makinfratech-api.onrender.com";
var TOKEN = localStorage.getItem("token") || "";
var PAGE = "dashboard";

var PAGES = ["Dashboard","Users","Customers","Buildings","Flats","Assets","Work Orders","Invoices","Expenses","AMC","Reports"];
var KEYS = ["dashboard","users","customers","buildings","flats","assets","workorders","invoices","expenses","amc","reports"];
var ENDPOINTS = {users:"/api/users",customers:"/api/customers",buildings:"/api/buildings",workorders:"/api/work-orders",invoices:"/api/invoices",expenses:"/api/expenses",amc:"/api/amc"};

// Build nav
var nav = document.getElementById("navMenu");
for(var i=0;i<PAGES.length;i++){
  var div = document.createElement("div");
  div.className = "nav-item";
  div.textContent = PAGES[i];
  div.setAttribute("data-key", KEYS[i]);
  if(KEYS[i]===PAGE) div.className += " active";
  div.onclick = (function(k){return function(){showPage(k);};})(KEYS[i]);
  nav.appendChild(div);
}

// Login
document.getElementById("loginBtn").onclick = function(){
  var email = document.getElementById("email").value.trim();
  var pass = document.getElementById("password").value;
  var err = document.getElementById("error");
  if(!email || !pass){err.textContent="Please fill all fields";err.style.display="block";return;}
  fetch(API+"/api/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:email,password:pass})})
  .then(function(r){return r.json().then(function(d){return{ok:r.ok,data:d}});})
  .then(function(res){
    if(!res.ok){throw new Error(res.data.message||"Login failed");}
    TOKEN = res.data.access_token || res.data.token;
    localStorage.setItem("token",TOKEN);
    document.getElementById("loginPage").style.display = "none";
    document.getElementById("appLayout").style.display = "block";
    showPage("dashboard");
  })
  .catch(function(e){err.textContent=e.message;err.style.display="block";});
};

// Logout
document.getElementById("logoutBtn").onclick = function(){
  localStorage.removeItem("token");TOKEN="";
  document.getElementById("loginPage").style.display="flex";
  document.getElementById("appLayout").style.display="none";
};

// Auto login
if(TOKEN){
  document.getElementById("loginPage").style.display = "none";
  document.getElementById("appLayout").style.display = "block";
  showPage("dashboard");
}

function showPage(page){
  PAGE = page;
  document.querySelectorAll(".nav-item").forEach(function(el){el.classList.remove("active");});
  document.querySelectorAll(".nav-item").forEach(function(el){if(el.getAttribute("data-key")===page)el.classList.add("active");});
  document.getElementById("pageTitle").textContent = page.charAt(0).toUpperCase()+page.slice(1);
  var content = document.getElementById("contentArea");
  content.innerHTML = "<p>Loading...</p>";

  if(page==="dashboard"){
    content.innerHTML = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px;margin-bottom:32px">'+
      '<div class="card" style="border-left:4px solid #3b82f6;padding:24px"><h3 style="font-size:13px;color:#64748b;text-transform:uppercase">Total Users</h3><div style="font-size:32px;font-weight:800">-</div></div>'+
      '<div class="card" style="border-left:4px solid #16a34a;padding:24px"><h3 style="font-size:13px;color:#64748b;text-transform:uppercase">Customers</h3><div style="font-size:32px;font-weight:800">-</div></div>'+
      '<div class="card" style="border-left:4px solid #ca8a04;padding:24px"><h3 style="font-size:13px;color:#64748b;text-transform:uppercase">Buildings</h3><div style="font-size:32px;font-weight:800">-</div></div>'+
      '<div class="card" style="border-left:4px solid #dc2626;padding:24px"><h3 style="font-size:13px;color:#64748b;text-transform:uppercase">Work Orders</h3><div style="font-size:32px;font-weight:800">-</div></div></div>'+
      '<div class="card"><div class="card-header"><h3>Welcome</h3></div><div style="padding:24px"><p>Dashboard is loading. Click a menu item to view data.</p></div></div>';
  }
  else if(page==="reports"){
    content.innerHTML = '<div class="card"><div class="card-header"><h3>Reports</h3></div><div style="padding:24px"><p>Reports module coming soon.</p></div></div>';
  }
  else {
    var ep = ENDPOINTS[page];
    if(!ep){content.innerHTML='<div class="card"><div style="padding:24px"><p>Module under construction.</p></div></div>';return;}
    fetch(API+ep,{headers:{"Authorization":"Bearer "+TOKEN}})
    .then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json();})
    .then(function(data){
      var rows = Array.isArray(data)?data:(data.data||data.items||[]);
      CURRENT_DATA = rows;
      if(rows.length===0){content.innerHTML='<div class="card"><div style="padding:24px;text-align:center;color:#64748b"><p>No records found.</p></div></div>';return;}
      var html = '<div class="card"><div class="card-header"><h3>'+page+'</h3></div><div style="overflow-x:auto"><table class="data-table"><thead><tr>';
      var keys = Object.keys(rows[0]).filter(function(k){return k!=="password"&&k!=="createdAt"&&k!=="updatedAt";});
      keys.slice(0,5).forEach(function(k){html+='<th>'+k+'</th>';});
      html+='<th>Actions</th></tr></thead><tbody>';
      rows.forEach(function(row){
        html+='<tr>';
        keys.slice(0,5).forEach(function(k){html+='<td>'+(row[k]||"-")+'</td>';});
        html+='<td><button class="btn btn-sm" style="background:#475569" onclick="editRow(''+row.id+'')">Edit</button> <button class="btn btn-sm" style="background:#dc2626" onclick="delRow(''+row.id+'')">Delete</button></td></tr>';
      });
      html+='</tbody></table></div></div>';
      content.innerHTML = html;
    })
    .catch(function(e){content.innerHTML='<div class="card"><div style="padding:24px;color:#dc2626"><p>Error: '+e.message+'</p></div></div>';});
  }
}

// Modal
document.getElementById("addBtn").onclick = openModal;
document.getElementById("closeBtn").onclick = closeModal;
document.getElementById("cancelBtn").onclick = closeModal;
document.getElementById("saveBtn").onclick = saveRecord;

function openModal(){
  document.getElementById("modalOverlay").classList.add("active");
  var body = document.getElementById("modalBody");
  body.innerHTML = "";
  document.getElementById("modalTitle").textContent = "Add New " + PAGE;

  if(PAGE==="users"){
    body.appendChild(makeField("Name","formName","text"));
    body.appendChild(makeField("Email","formEmail","email"));
    body.appendChild(makeField("Password","formPassword","password"));
    body.appendChild(makeSelect("Role","formRole",["ADMIN","MANAGER","TECHNICIAN","COORDINATOR","ACCOUNTANT","VIEWER","SUPER_ADMIN"]));
  }
  else if(PAGE==="customers"){
    body.appendChild(makeField("Name","formName","text"));
    body.appendChild(makeField("Email","formEmail","email"));
    body.appendChild(makeField("Phone","formPhone","text"));
    body.appendChild(makeField("Address","formAddress","text"));
  }
  else if(PAGE==="buildings"){
    body.appendChild(makeField("Name","formName","text"));
    body.appendChild(makeField("Address","formAddress","text"));
  }
  else if(PAGE==="workorders"){
    body.appendChild(makeField("Title","formTitle","text"));
    body.appendChild(makeField("Description","formDesc","text"));
    body.appendChild(makeSelect("Priority","formPriority",["LOW","MEDIUM","HIGH","URGENT"]));
  }
  else if(PAGE==="invoices"){
    body.appendChild(makeField("Invoice Number","formNumber","text"));
    body.appendChild(makeField("Amount","formAmount","number"));
    body.appendChild(makeSelect("Status","formStatus",["DRAFT","SENT","PAID","OVERDUE"]));
  }
  else if(PAGE==="expenses"){
    body.appendChild(makeField("Category","formCategory","text"));
    body.appendChild(makeField("Amount","formAmount","number"));
    body.appendChild(makeField("Date","formDate","date"));
  }
  else if(PAGE==="amc"){
    body.appendChild(makeField("Contract Title","formTitle","text"));
    body.appendChild(makeField("Vendor","formVendor","text"));
    body.appendChild(makeField("Contract Value","formValue","number"));
    body.appendChild(makeField("PPM Count","formPpm","number"));
    body.appendChild(makeField("EMI Count","formEmi","number"));
    body.appendChild(makeField("Start Date","formStart","date"));
    body.appendChild(makeField("End Date","formEnd","date"));

    var calc = document.createElement("div");
    calc.className = "calc-box";
    calc.id = "emiBox";
    calc.style.display = "none";
    calc.innerHTML = "<h4>EMI Calculation</h4><div id='emiResult'></div>";
    body.appendChild(calc);

    document.getElementById("formValue").oninput = updateEmi;
    document.getElementById("formEmi").oninput = updateEmi;
  }
  else {
    body.innerHTML = "<p>Form not available for this module.</p>";
  }
}

function updateEmi(){
  var val = parseFloat(document.getElementById("formValue").value)||0;
  var count = parseInt(document.getElementById("formEmi").value)||0;
  if(val>0 && count>0){
    var emi = (val/count).toFixed(2);
    document.getElementById("emiBox").style.display = "block";
    document.getElementById("emiResult").innerHTML = 
      "<div class='calc-row'><span>Contract Value</span><span>AED "+val.toFixed(2)+"</span></div>"+
      "<div class='calc-row'><span>EMI Count</span><span>"+count+"</span></div>"+
      "<div class='calc-row'><span>EMI Amount</span><span>AED "+emi+"</span></div>"+
      "<div class='calc-row'><span>Total</span><span>AED "+val.toFixed(2)+"</span></div>";
  }
}

function closeModal(){document.getElementById("modalOverlay").classList.remove("active");}

function makeField(label,id,type){
  var div = document.createElement("div");div.className="form-group";
  var lbl = document.createElement("label");lbl.textContent=label;
  var inp = document.createElement("input");inp.type=type;inp.id=id;
  div.appendChild(lbl);div.appendChild(inp);
  return div;
}
function makeSelect(label,id,opts){
  var div = document.createElement("div");div.className="form-group";
  var lbl = document.createElement("label");lbl.textContent=label;
  var sel = document.createElement("select");sel.id=id;
  opts.forEach(function(o){var op=document.createElement("option");op.value=o;op.textContent=o;sel.appendChild(op);});
  div.appendChild(lbl);div.appendChild(sel);
  return div;
}

function saveRecord(){
  var ep = ENDPOINTS[PAGE];
  if(!ep){closeModal();return;}
  var data = {};
  var ids = ["formName","formEmail","formPassword","formPhone","formAddress","formTitle","formDesc","formNumber","formAmount","formCategory","formDate","formVendor","formValue","formPpm","formEmi","formStart","formEnd"];
  ids.forEach(function(id){var el=document.getElementById(id);if(el&&el.value){data[id.replace("form","").toLowerCase()]=el.value;}});
  var roleEl = document.getElementById("formRole");if(roleEl)data.role=roleEl.value;
  var priEl = document.getElementById("formPriority");if(priEl)data.priority=priEl.value;
  var stEl = document.getElementById("formStatus");if(stEl)data.status=stEl.value;
  if(data.amount)data.amount=parseFloat(data.amount);
  if(data.value)data.value=parseFloat(data.value);
  if(data.ppm)data.ppmFrequency=parseInt(data.ppm);
  if(data.emi)data.emiCount=parseInt(data.emi);

  fetch(API+ep,{method:"POST",headers:{"Authorization":"Bearer "+TOKEN,"Content-Type":"application/json"},body:JSON.stringify(data)})
  .then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json();})
  .then(function(){closeModal();showPage(PAGE);})
  .catch(function(e){alert("Error: "+e.message);});
}

function editRow(id){alert("Edit: "+id);}
function delRow(id){
  if(!confirm("Delete?"))return;
  fetch(API+ENDPOINTS[PAGE]+"/"+id,{method:"DELETE",headers:{"Authorization":"Bearer "+TOKEN}})
  .then(function(){showPage(PAGE);})
  .catch(function(e){alert("Error: "+e.message);});
}
</script>
</body>
</html>
