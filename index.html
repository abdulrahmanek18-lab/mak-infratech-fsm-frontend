<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAK INFRATECH FSM - Facilities Management ERP</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --danger: #dc2626;
            --success: #16a34a;
            --warning: #ca8a04;
            --bg: #f1f5f9;
            --card: #ffffff;
            --text: #1e293b;
            --text-light: #64748b;
            --border: #e2e8f0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        /* Login Page */
        .login-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .login-box {
            background: var(--card);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 420px;
        }

        .login-box h1 {
            font-size: 28px;
            margin-bottom: 8px;
            color: var(--text);
        }

        .login-box p {
            color: var(--text-light);
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text);
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 15px;
            transition: border-color 0.2s;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--primary);
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover {
            background: var(--primary-dark);
        }

        .btn-secondary {
            background: var(--text-light);
        }

        .btn-danger {
            background: var(--danger);
        }

        .btn-success {
            background: var(--success);
        }

        .btn-sm {
            padding: 8px 16px;
            font-size: 13px;
            width: auto;
        }

        .error-msg {
            color: var(--danger);
            font-size: 14px;
            margin-top: 12px;
            text-align: center;
            display: none;
        }

        /* Layout */
        .app-layout {
            display: none;
            min-height: 100vh;
        }

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 260px;
            height: 100vh;
            background: var(--card);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            z-index: 100;
        }

        .sidebar-header {
            padding: 24px;
            border-bottom: 1px solid var(--border);
        }

        .sidebar-header h2 {
            font-size: 22px;
            color: var(--primary);
        }

        .sidebar-header span {
            font-size: 12px;
            color: var(--text-light);
        }

        .nav-menu {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: 8px;
            cursor: pointer;
            color: var(--text);
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
            margin-bottom: 4px;
        }

        .nav-item:hover,
        .nav-item.active {
            background: #eff6ff;
            color: var(--primary);
        }

        .nav-item svg {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
        }

        .sidebar-footer {
            padding: 16px;
            border-top: 1px solid var(--border);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .user-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
        }

        .user-details {
            font-size: 13px;
        }

        .user-details div:first-child {
            font-weight: 600;
        }

        .user-details div:last-child {
            color: var(--text-light);
            font-size: 12px;
        }

        .main-content {
            margin-left: 260px;
            min-height: 100vh;
        }

        .topbar {
            background: var(--card);
            padding: 16px 32px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .page-title {
            font-size: 20px;
            font-weight: 600;
        }

        .topbar-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .content-area {
            padding: 32px;
        }

        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }

        .stat-card {
            background: var(--card);
            padding: 24px;
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        .stat-card h3 {
            font-size: 14px;
            color: var(--text-light);
            font-weight: 500;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 32px;
            font-weight: 700;
            color: var(--text);
        }

        .stat-card.primary {
            border-top: 3px solid var(--primary);
        }

        .stat-card.success {
            border-top: 3px solid var(--success);
        }

        .stat-card.warning {
            border-top: 3px solid var(--warning);
        }

        .stat-card.danger {
            border-top: 3px solid var(--danger);
        }

        /* Cards */
        .card {
            background: var(--card);
            border-radius: 12px;
            border: 1px solid var(--border);
            overflow: hidden;
        }

        .card-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-header h3 {
            font-size: 16px;
            font-weight: 600;
        }

        .card-body {
            padding: 0;
        }

        /* Table */
        .data-table {
            width: 100%;
            border-collapse: collapse;
        }

        .data-table th {
            text-align: left;
            padding: 14px 24px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--text-light);
            background: var(--bg);
            border-bottom: 1px solid var(--border);
        }

        .data-table td {
            padding: 14px 24px;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
        }

        .data-table tr:hover td {
            background: #f8fafc;
        }

        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge-success {
            background: #dcfce7;
            color: #166534;
        }

        .badge-warning {
            background: #fef9c3;
            color: #854d0e;
        }

        .badge-danger {
            background: #fee2e2;
            color: #991b1b;
        }

        .badge-info {
            background: #dbeafe;
            color: #1e40af;
        }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 200;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: var(--card);
            border-radius: 12px;
            width: 90%;
            max-width: 560px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
        }

        .modal-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h3 {
            font-size: 18px;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--text-light);
        }

        .modal-body {
            padding: 24px;
        }

        .modal-footer {
            padding: 16px 24px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        /* Loading */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px;
            color: var(--text-light);
        }

        .empty-state {
            text-align: center;
            padding: 60px;
            color: var(--text-light);
        }

        .empty-state h4 {
            margin-bottom: 8px;
            color: var(--text);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                transform: translateX(-100%);
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .main-content {
                margin-left: 0;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

    <script>
        // ===================== CONFIG =====================
        let API_BASE = localStorage.getItem('apiUrl') || '';
        let AUTH_TOKEN = localStorage.getItem('token') || '';
        let CURRENT_PAGE = 'dashboard';
        let CURRENT_DATA = [];

        // ===================== AUTH =====================
        async function handleLogin() {
            const url = document.getElementById('apiUrl').value.trim();
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            const errorDiv = document.getElementById('loginError');

            if (!url || !email || !password) {
                errorDiv.textContent = 'Please fill all fields';
                errorDiv.style.display = 'block';
                return;
            }

            API_BASE = url.replace(/\/$/, '');

            try {
                const res = await fetch(`${API_BASE}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();

                if (!res.ok) {
                    throw new Error(data.message || 'Login failed');
                }

                AUTH_TOKEN = data.access_token || data.token;
                localStorage.setItem('token', AUTH_TOKEN);
                localStorage.setItem('apiUrl', API_BASE);
                localStorage.setItem('user', JSON.stringify(data.user || { email }));

                showApp();
            } catch (err) {
                errorDiv.textContent = err.message;
                errorDiv.style.display = 'block';
            }
        }

        function handleLogout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            AUTH_TOKEN = '';
            document.getElementById('loginPage').style.display = 'flex';
            document.getElementById('appLayout').style.display = 'none';
        }

        function showApp() {
            document.getElementById('loginPage').style.display = 'none';
            document.getElementById('appLayout').style.display = 'flex';

            const user = JSON.parse(localStorage.getItem('user') || '{}');
            document.getElementById('userName').textContent = user.name || user.email || 'Admin';
            document.getElementById('userAvatar').textContent = (user.name || user.email || 'A')[0].toUpperCase();

            showPage('dashboard');
        }

        // ===================== API =====================
        async function apiGet(endpoint) {
            const res = await fetch(`${API_BASE}${endpoint}`, {
                headers: { 'Authorization': `Bearer ${AUTH_TOKEN}` }
            });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            return res.json();
        }

        async function apiPost(endpoint, data) {
            const res = await fetch(`${API_BASE}${endpoint}`, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${AUTH_TOKEN}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            return res.json();
        }

        async function apiPatch(endpoint, data) {
            const res = await fetch(`${API_BASE}${endpoint}`, {
                method: 'PATCH',
                headers: {
                    'Authorization': `Bearer ${AUTH_TOKEN}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            return res.json();
        }

        async function apiDelete(endpoint) {
            const res = await fetch(`${API_BASE}${endpoint}`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${AUTH_TOKEN}` }
            });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            return res.json();
        }

        // ===================== PAGES =====================
        function showPage(page) {
            CURRENT_PAGE = page;
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            event?.target?.classList.add('active');

            const titles = {
                dashboard: 'Dashboard',
                users: 'Users',
                customers: 'Customers',
                buildings: 'Buildings',
                flats: 'Flats',
                assets: 'Assets',
                workorders: 'Work Orders',
                invoices: 'Invoices',
                expenses: 'Expenses',
                amc: 'AMC Contracts',
                reports: 'Reports'
            };
            document.getElementById('pageTitle').textContent = titles[page] || page;

            const content = document.getElementById('contentArea');
            content.innerHTML = '<div class="loading">Loading...</div>';

            switch (page) {
                case 'dashboard': loadDashboard(); break;
                case 'users': loadTable('/api/users', ['ID', 'Name', 'Email', 'Role'], user => [user.id, user.name, user.email, user.role]); break;
                case 'customers': loadTable('/api/customers', ['ID', 'Name', 'Email', 'Phone'], c => [c.id, c.name, c.email, c.phone]); break;
                case 'buildings': loadTable('/api/buildings', ['ID', 'Name', 'Address', 'Flats'], b => [b.id, b.name, b.address, b.flatCount || '-']); break;
                case 'flats': loadTable('/api/flats', ['ID', 'Number', 'Building', 'Status'], f => [f.id, f.number, f.buildingName, f.status]); break;
                case 'assets': loadTable('/api/assets', ['ID', 'Name', 'Type', 'Status'], a => [a.id, a.name, a.type, a.status]); break;
                case 'workorders': loadTable('/api/work-orders', ['ID', 'Title', 'Status', 'Priority'], w => [w.id, w.title, w.status, w.priority]); break;
                case 'invoices': loadTable('/api/invoices', ['ID', 'Number', 'Amount', 'Status'], i => [i.id, i.invoiceNumber, i.totalAmount, i.status]); break;
                case 'expenses': loadTable('/api/expenses', ['ID', 'Category', 'Amount', 'Date'], e => [e.id, e.category, e.amount, e.date]); break;
                case 'amc': loadTable('/api/amc', ['ID', 'Title', 'Vendor', 'Status'], a => [a.id, a.title, a.vendor, a.status]); break;
                case 'reports': loadReports(); break;
                default: content.innerHTML = '<div class="empty-state"><h4>Page Under Construction</h4><p>This feature is coming soon.</p></div>';
            }
        }

        // ===================== DASHBOARD =====================
        async function loadDashboard() {
            const content = document.getElementById('contentArea');
            try {
                const [users, customers, buildings, workorders, invoices, assets] = await Promise.allSettled([
                    apiGet('/api/users').catch(() => []),
                    apiGet('/api/customers').catch(() => []),
                    apiGet('/api/buildings').catch(() => []),
                    apiGet('/api/work-orders').catch(() => []),
                    apiGet('/api/invoices').catch(() => []),
                    apiGet('/api/assets').catch(() => [])
                ]);

                const stats = [
                    { label: 'Total Users', value: users.value?.length || 0, type: 'primary' },
                    { label: 'Customers', value: customers.value?.length || 0, type: 'success' },
                    { label: 'Buildings', value: buildings.value?.length || 0, type: 'warning' },
                    { label: 'Work Orders', value: workorders.value?.length || 0, type: 'danger' },
                    { label: 'Invoices', value: invoices.value?.length || 0, type: 'primary' },
                    { label: 'Assets', value: assets.value?.length || 0, type: 'success' }
                ];

                let html = '<div class="stats-grid">';
                stats.forEach(s => {
                    html += `<div class="stat-card ${s.type}"><h3>${s.label}</h3><div class="stat-value">${s.value}</div></div>`;
                });
                html += '</div>';

                // Recent Work Orders
                html += `<div class="card"><div class="card-header"><h3>Recent Work Orders</h3></div><div class="card-body">`;
                if (workorders.value?.length) {
                    html += renderTable(['ID', 'Title', 'Status', 'Priority'], workorders.value.slice(0, 5), w => [w.id, w.title, badge(w.status), badge(w.priority)]);
                } else {
                    html += '<div class="empty-state">No work orders found</div>';
                }
                html += '</div></div>';

                content.innerHTML = html;
            } catch (err) {
                content.innerHTML = `<div class="empty-state"><h4>Error</h4><p>${err.message}</p></div>`;
            }
        }

        // ===================== TABLE =====================
        async function loadTable(endpoint, columns, rowMapper) {
            const content = document.getElementById('contentArea');
            try {
                const data = await apiGet(endpoint);
                CURRENT_DATA = Array.isArray(data) ? data : (data.data || data.items || []);

                let html = '<div class="card"><div class="card-body">';
                html += renderTable(columns, CURRENT_DATA, rowMapper);
                html += '</div></div>';
                content.innerHTML = html;
            } catch (err) {
                content.innerHTML = `<div class="empty-state"><h4>Error Loading Data</h4><p>${err.message}</p><p>Make sure your backend API is running and the endpoint exists.</p></div>`;
            }
        }

        function renderTable(columns, rows, rowMapper) {
            if (!rows || rows.length === 0) {
                return '<div class="empty-state"><h4>No Data</h4><p>No records found.</p></div>';
            }

            let html = '<table class="data-table"><thead><tr>';
            columns.forEach(c => html += `<th>${c}</th>`);
            html += '<th>Actions</th></tr></thead><tbody>';

            rows.forEach(row => {
                const cells = rowMapper(row);
                html += '<tr>';
                cells.forEach(c => html += `<td>${c}</td>`);
                html += `<td><button class="btn btn-sm btn-secondary" onclick="editRecord('${row.id}')">Edit</button> <button class="btn btn-sm btn-danger" onclick="deleteRecord('${row.id}')">Delete</button></td>`;
                html += '</tr>';
            });

            html += '</tbody></table>';
            return html;
        }

        function badge(text) {
            if (!text) return '-';
            const t = text.toString().toLowerCase();
            let cls = 'badge-info';
            if (['active', 'completed', 'paid', 'approved', 'success'].includes(t)) cls = 'badge-success';
            else if (['pending', 'in progress', 'partial', 'review'].includes(t)) cls = 'badge-warning';
            else if (['cancelled', 'overdue', 'rejected', 'failed', 'urgent'].includes(t)) cls = 'badge-danger';
            return `<span class="badge ${cls}">${text}</span>`;
        }

        // ===================== REPORTS =====================
        async function loadReports() {
            const content = document.getElementById('contentArea');
            try {
                const vat = await apiGet('/api/invoices/reports/vat').catch(() => null);

                let html = '<div class="stats-grid">';
                html += `<div class="stat-card primary"><h3>VAT Report</h3><div class="stat-value">${vat ? 'Available' : 'N/A'}</div></div>`;
                html += '</div>';

                if (vat) {
                    html += `<div class="card"><div class="card-header"><h3>VAT Summary</h3></div><div class="card-body"><pre style="padding:24px;overflow:auto">${JSON.stringify(vat, null, 2)}</pre></div></div>`;
                }

                content.innerHTML = html;
            } catch (err) {
                content.innerHTML = `<div class="empty-state"><h4>Error</h4><p>${err.message}</p></div>`;
            }
        }

        // ===================== MODAL / CRUD =====================
        function openModal() {
            document.getElementById('modalOverlay').classList.add('active');
            const body = document.getElementById('modalBody');

            const forms = {
                users: `<div class="form-group"><label>Name</label><input type="text" id="formName" placeholder="Full name"></div><div class="form-group"><label>Email</label><input type="email" id="formEmail" placeholder="Email address"></div><div class="form-group"><label>Password</label><input type="password" id="formPassword" placeholder="Password"></div><div class="form-group"><label>Role</label><select id="formRole"><option value="admin">Admin</option><option value="manager">Manager</option><option value="staff">Staff</option></select></div>`,
                customers: `<div class="form-group"><label>Name</label><input type="text" id="formName" placeholder="Customer name"></div><div class="form-group"><label>Email</label><input type="email" id="formEmail" placeholder="Email"></div><div class="form-group"><label>Phone</label><input type="text" id="formPhone" placeholder="Phone number"></div><div class="form-group"><label>Address</label><input type="text" id="formAddress" placeholder="Address"></div>`,
                buildings: `<div class="form-group"><label>Name</label><input type="text" id="formName" placeholder="Building name"></div><div class="form-group"><label>Address</label><input type="text" id="formAddress" placeholder="Address"></div>`,
                workorders: `<div class="form-group"><label>Title</label><input type="text" id="formTitle" placeholder="Work order title"></div><div class="form-group"><label>Description</label><input type="text" id="formDescription" placeholder="Description"></div><div class="form-group"><label>Priority</label><select id="formPriority"><option value="low">Low</option><option value="medium">Medium</option><option value="high">High</option><option value="urgent">Urgent</option></select></div>`,
                invoices: `<div class="form-group"><label>Invoice Number</label><input type="text" id="formNumber" placeholder="INV-001"></div><div class="form-group"><label>Amount</label><input type="number" id="formAmount" placeholder="0.00"></div><div class="form-group"><label>Status</label><select id="formStatus"><option value="draft">Draft</option><option value="sent">Sent</option><option value="paid">Paid</option><option value="overdue">Overdue</option></select></div>`,
                expenses: `<div class="form-group"><label>Category</label><input type="text" id="formCategory" placeholder="Category"></div><div class="form-group"><label>Amount</label><input type="number" id="formAmount" placeholder="0.00"></div><div class="form-group"><label>Date</label><input type="date" id="formDate"></div><div class="form-group"><label>Description</label><input type="text" id="formDescription" placeholder="Description"></div>`,
                amc: `<div class="form-group"><label>Title</label><input type="text" id="formTitle" placeholder="Contract title"></div><div class="form-group"><label>Vendor</label><input type="text" id="formVendor" placeholder="Vendor name"></div><div class="form-group"><label>Start Date</label><input type="date" id="formStartDate"></div><div class="form-group"><label>End Date</label><input type="date" id="formEndDate"></div>`
            };

            body.innerHTML = forms[CURRENT_PAGE] || '<p>No form available for this page.</p>';
            document.getElementById('modalTitle').textContent = 'Add New ' + (CURRENT_PAGE.charAt(0).toUpperCase() + CURRENT_PAGE.slice(1));
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('active');
        }

        async function saveRecord() {
            const endpoints = {
                users: '/api/users',
                customers: '/api/customers',
                buildings: '/api/buildings',
                workorders: '/api/work-orders',
                invoices: '/api/invoices',
                expenses: '/api/expenses',
                amc: '/api/amc'
            };

            const endpoint = endpoints[CURRENT_PAGE];
            if (!endpoint) return;

            const data = {};
            const name = document.getElementById('formName')?.value;
            const email = document.getElementById('formEmail')?.value;
            const phone = document.getElementById('formPhone')?.value;
            const address = document.getElementById('formAddress')?.value;
            const title = document.getElementById('formTitle')?.value;
            const description = document.getElementById('formDescription')?.value;
            const priority = document.getElementById('formPriority')?.value;
            const status = document.getElementById('formStatus')?.value;
            const amount = document.getElementById('formAmount')?.value;
            const category = document.getElementById('formCategory')?.value;
            const date = document.getElementById('formDate')?.value;
            const vendor = document.getElementById('formVendor')?.value;
            const startDate = document.getElementById('formStartDate')?.value;
            const endDate = document.getElementById('formEndDate')?.value;
            const password = document.getElementById('formPassword')?.value;
            const role = document.getElementById('formRole')?.value;
            const number = document.getElementById('formNumber')?.value;

            if (name) data.name = name;
            if (email) data.email = email;
            if (phone) data.phone = phone;
            if (address) data.address = address;
            if (title) data.title = title;
            if (description) data.description = description;
            if (priority) data.priority = priority;
            if (status) data.status = status;
            if (amount) data.amount = parseFloat(amount);
            if (category) data.category = category;
            if (date) data.date = date;
            if (vendor) data.vendor = vendor;
            if (startDate) data.startDate = startDate;
            if (endDate) data.endDate = endDate;
            if (password) data.password = password;
            if (role) data.role = role;
            if (number) data.invoiceNumber = number;

            try {
                await apiPost(endpoint, data);
                closeModal();
                showPage(CURRENT_PAGE);
            } catch (err) {
                alert('Error: ' + err.message);
            }
        }

        async function editRecord(id) {
            alert('Edit feature: Implement PATCH /api/' + CURRENT_PAGE + '/' + id);
        }

        async function deleteRecord(id) {
            if (!confirm('Are you sure you want to delete this record?')) return;

            const endpoints = {
                users: '/api/users',
                customers: '/api/customers',
                buildings: '/api/buildings',
                workorders: '/api/work-orders',
                invoices: '/api/invoices',
                expenses: '/api/expenses',
                amc: '/api/amc'
            };

            try {
                await apiDelete(`${endpoints[CURRENT_PAGE]}/${id}`);
                showPage(CURRENT_PAGE);
            } catch (err) {
                alert('Error: ' + err.message);
            }
        }

        // ===================== INIT =====================
        window.onload = function () {
            if (AUTH_TOKEN && API_BASE) {
                showApp();
            }
        };
    </script>
</body>

</html>
